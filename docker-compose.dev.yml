services:
    app:
        build:
            target: dev
        environment:
            APP_ENV: dev
            XDEBUG_MODE: debug,develop
            XDEBUG_CONFIG: "client_host=host.docker.internal client_port=9003 idekey=PHPSTORM"
            PHP_IDE_CONFIG: "serverName=localhost"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - ./backend:/var/www/html
            - ./backend/docker/php/php.ini:/usr/local/etc/php/conf.d/99-opcache.ini:ro
            - ./backend/docker/php/docker-php-ext-xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini:ro

    messenger-worker:
        build:
            target: dev
        environment:
            APP_ENV: dev
        volumes:
            - ./backend:/var/www/html
            - ./backend/docker/php/php.ini:/usr/local/etc/php/conf.d/99-opcache.ini:ro

    frontend:
        build:
            target: dev
        volumes:
            - ./frontend:/app
            - /app/node_modules
