server {
    listen 80;
    root /usr/share/nginx/html;

    resolver 127.0.0.11 valid=30s;

    # httpClient.ts uses a relative baseURL ("/") so cookies stay same-origin
    # with no CORS involved — that only works if this container also proxies
    # /api itself. "nginx" here is the backend's own nginx service name in
    # docker-compose.yml (same host the dev-server's Vite proxy targets via
    # VITE_API_PROXY_TARGET); point it elsewhere if this image is deployed
    # against a different backend host.
    location /api {
        set $backend "http://nginx:80";
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        # SPA fallback: let react-router handle client-side routes.
        try_files $uri /index.html;

        # Scoped to this location, not the /api proxy above — the backend
        # (SecurityHeadersListener) already sets these on its own responses,
        # and add_header doesn't dedupe against headers an upstream already sent.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
