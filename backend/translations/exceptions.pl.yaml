# Every ApiException/ServerException's `detail` goes through the translator with
# this domain before being sent to the client (see ExceptionSubscriber). Most
# throw sites just pass one of these keys as `message:`; the few with
# per-request data (e.g. item.duplicate_content) translate inline at the throw
# site instead, with %placeholders% substituted there — see ItemService,
# FileValidator, ImageValidator.

# Generic HTTP-status defaults (used when a throw site doesn't override the message).
bad_request: "Nieprawidłowe żądanie."
unauthorized: "Wymagane jest zalogowanie."
forbidden: "Brak uprawnień do wykonania tej operacji."
not_found: "Nie znaleziono zasobu."
conflict: "Konflikt z istniejącymi danymi."
unprocessable_content: "Przesłane dane są nieprawidłowe."
too_many_requests: "Zbyt wiele prób. Spróbuj ponownie później."
internal_server_error: "Wystąpił błąd wewnętrzny serwera."

