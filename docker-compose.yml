services:
    app:
        build:
            target: dev
            context: ./backend
            dockerfile: Dockerfile
        image: pouch-app-php-fpm
        container_name: pouch_app
        restart: unless-stopped
        extra_hosts:
            - host.docker.internal:host-gateway
        environment:
            SERVER_NAME: ${SERVER_NAME:-localhost}
            PHP_INI_MEMORY_LIMIT: 512M
            BACKUP_DIR: /var/backups/pouch
        volumes:
            # Read/inspect backups made by backup-scheduler, and run
            # app:backup:run/app:backup:restore-test manually via `make console`.
            - backup-data:/var/backups/pouch
        depends_on:
            db:
                condition: service_healthy

    # Consumes the `async` Messenger transport (Part 4: OCR/thumbnails/URL
    # scraping) — same image as `app`, just a different command. Without this
    # running, ScrapeUrlMessage/ProcessPhotoMessage pile up in
    # messenger_messages and items stay stuck at processingStatus "pending".
    messenger-worker:
        build:
            target: dev
            context: ./backend
            dockerfile: Dockerfile
        image: pouch-app-php-fpm
        container_name: pouch_messenger_worker
        restart: unless-stopped
        command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=256M -vv
        environment:
            SERVER_NAME: ${SERVER_NAME:-localhost}
        depends_on:
            db:
                condition: service_healthy
            minio:
                condition: service_healthy

    # Runs `app:item:gc` on a loop (hourly — matches the finest TTL preset,
    # 1h) — without this, expired items never move to trash and trashed
    # items never get purged; the console command and the admin dashboard's
    # "Run GC Now" both existed already, but neither runs on its own.
    gc-scheduler:
        build:
            target: dev
            context: ./backend
            dockerfile: Dockerfile
        image: pouch-app-php-fpm
        container_name: pouch_gc_scheduler
        restart: unless-stopped
        command: sh -c "while true; do php bin/console app:item:gc --no-interaction; sleep 3600; done"
        environment:
            SERVER_NAME: ${SERVER_NAME:-localhost}
        depends_on:
            db:
                condition: service_healthy
            minio:
                condition: service_healthy

    # Runs `app:backup:run` on a loop (daily — a schema/storage-level backup
    # doesn't need finer granularity than that) — without this, the only
    # backup mechanism is AdminController's manual, on-demand ZIP export.
    backup-scheduler:
        build:
            target: dev
            context: ./backend
            dockerfile: Dockerfile
        image: pouch-app-php-fpm
        container_name: pouch_backup_scheduler
        restart: unless-stopped
        command: sh -c "while true; do php bin/console app:backup:run --no-interaction; sleep 86400; done"
        environment:
            SERVER_NAME: ${SERVER_NAME:-localhost}
            BACKUP_DIR: /var/backups/pouch
        volumes:
            - backup-data:/var/backups/pouch
        depends_on:
            db:
                condition: service_healthy
            minio:
                condition: service_healthy

    nginx:
        image: nginx:stable-alpine
        container_name: pouch_nginx
        restart: unless-stopped
        ports:
            - "8111:80"
        volumes:
            - ./backend:/var/www/html:ro
            - ./backend/docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - db
            - app

    db:
        image: postgres:${POSTGRES_VERSION:-16}-alpine
        container_name: pouch_db
        restart: unless-stopped
        ports:
            - "5433:5432"
        volumes:
            - db-data:/var/lib/postgresql/data:rw
            - ./backend/docker/db/init:/docker-entrypoint-initdb.d:ro
        env_file:
            - ./backend/.env
            - ./backend/.env.local
        healthcheck:
            test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
            timeout: 5s
            retries: 5
            start_period: 60s

    minio:
        image: minio/minio:latest
        container_name: pouch_minio
        restart: unless-stopped
        ports:
            - "9000:9000" # S3 API
            - "9001:9001" # Web console
        volumes:
            - minio-data:/data
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pouch}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pouch-dev-secret}
        command: server /data --console-address ":9001"
        healthcheck:
            test: ["CMD", "mc", "ready", "local"]
            interval: 5s
            timeout: 5s
            retries: 5

    minio-init:
        image: minio/mc:latest
        container_name: pouch_minio_init
        depends_on:
            minio:
                condition: service_healthy
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pouch}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pouch-dev-secret}
            MINIO_BUCKET: ${MINIO_BUCKET:-pouch}
        entrypoint: >
            /bin/sh -c "
            mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
            mc mb -p local/$$MINIO_BUCKET &&
            exit 0
            "
        restart: "no"

    frontend:
        build:
            target: dev
            context: ./frontend
            dockerfile: Dockerfile
        image: pouch-app-frontend
        container_name: pouch_frontend
        restart: unless-stopped
        ports:
            # Host port 5174, not 5173 — 5173 is already taken by another
            # project's container on this machine. Vite itself still listens
            # on 5173 inside the container (see frontend/vite.config.ts).
            - "5174:5173"
        environment:
            VITE_API_PROXY_TARGET: http://nginx:80
        depends_on:
            - nginx

volumes:
    db-data:
    minio-data:
    backup-data:
